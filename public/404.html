<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // GitHub Pages serves this 404 for unknown paths; to support SPA routing
      // we fetch the real index.html and replace the document, keeping
      // the original URL in the address bar so the SPA can read the path.
      (function(){
        try {
          // Try progressively shorter path prefixes to locate index.html.
          var segments = window.location.pathname.split('/');
          // ensure leading empty segment for absolute path
          if (segments.length === 0) segments = ['',''];
          var tried = 0;
          (function tryFetch(i){
            if (i < 0) { window.location.replace('/'); return; }
            var prefix = segments.slice(0, i+1).join('/');
            if (!prefix.endsWith('/')) prefix += '/';
            var candidate = prefix + 'index.html';
            fetch(candidate, {cache: 'no-store'}).then(function(resp){
              if (!resp.ok) throw new Error('no index');
              return resp.text();
            }).then(function(html){
              document.open();
              document.write(html);
              document.close();
            }).catch(function(){
              tried++;
              tryFetch(i-1);
            });
          })(segments.length - 1);
        } catch (e) {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
