<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // GitHub Pages serves this 404 for unknown paths; to support SPA routing
      // we fetch the real index.html and replace the document, keeping
      // the original URL in the address bar so the SPA can read the path.
      (function(){
        try {
          // Determine the repository base for project pages like /user/repo/...
          // Use only the first two non-empty path segments as the repo root.
          var parts = window.location.pathname.split('/').filter(function(p){ return p.length>0; });
          var repoRoot = '/';
          if (parts.length >= 2) repoRoot = '/' + parts.slice(0,2).join('/') + '/';

          // Try to fetch the real index.html from the repo root. This keeps the
          // original URL in the address bar so the SPA router can read it.
          var indexUrl = repoRoot + 'index.html';
          fetch(indexUrl, {cache: 'no-store'}).then(function(resp){
            if (!resp.ok) throw new Error('no index');
            return resp.text();
          }).then(function(html){
            document.open();
            document.write(html);
            document.close();
          }).catch(function(){
            // As a last resort, navigate to repo root (this will lose the path)
            window.location.replace(repoRoot);
          });
        } catch (e) {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
